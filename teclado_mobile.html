<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sinestinseut: Teclado Colorido</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="pagina-teclado">
    <h1>🎹 Teclado Colorido</h1>
    <p class="subtitulo">Cada cor é uma nota. Toque nas teclas e veja as bolhas subirem!</p>

    <nav class="nav-paginas" aria-label="Páginas">
        <a href="index.html">🎨 Desenhar</a>
        <a href="gerador_mobile.html">📱 Desenhar (sem servidor)</a>
        <a href="teclado_mobile.html" aria-current="page">🎹 Teclado<span class="nav-extra"> Colorido</span></a>
    </nav>

    <main>
        <div id="stage" aria-hidden="true"></div>

        <div class="teclas" id="teclas" role="group" aria-label="Teclas coloridas"></div>

        <p class="instructions so-teclado-fisico">
            No computador, use também as teclas
            <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> <kbd>F</kbd> <kbd>G</kbd> <kbd>H</kbd> <kbd>J</kbd> <kbd>K</kbd>
            (e <kbd>W</kbd> <kbd>E</kbd> <kbd>T</kbd> <kbd>Y</kbd> <kbd>U</kbd>) para tocar!
        </p>
    </main>

    <script>
        // --- VARIÁVEIS E CONSTANTES ---
        const stage = document.getElementById('stage');
        const teclas = document.getElementById('teclas');
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        const A4_FREQ = 440.0;
        const C4_FREQ = A4_FREQ * (2**(-9/12));

        // Mapeamento de Tecla para o Matiz (Hue)
        const keyToHue = {
            'a': 0, 'w': 30, 's': 60, 'e': 90, 'd': 120, 'f': 150,
            't': 180, 'g': 210, 'y': 240, 'h': 270, 'u': 300, 'j': 330, 'k': 360
        };

        const nomesNotas = ['Dó', 'Dó#', 'Ré', 'Ré#', 'Mi', 'Fá', 'Fá#', 'Sol', 'Sol#', 'Lá', 'Lá#', 'Si', 'Dó'];

        const activeOscillators = {};

        // --- FUNÇÕES DE ÁUDIO E VISUALIZAÇÃO ---

        function hueToFrequency(hue) {
            // 360 é o Dó da oitava de cima (não volta para o 0)
            const semitonesFromC4 = (hue / 360.0) * 12;
            return C4_FREQ * (2**(semitonesFromC4 / 12));
        }

        function corDaNota(hue) {
            return `hsl(${hue % 360}, 100%, 70%)`;
        }

        function createNoteBubble(hue, key) {
            const bubble = document.createElement('div');
            bubble.classList.add('note-bubble');

            const size = Math.random() * 50 + 50;
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.backgroundColor = `hsl(${hue % 360}, 100%, 80%)`;

            // Posição X baseada na nota para manter a ordem espectral
            const stageWidth = stage.clientWidth;
            const x = (keyToHue[key] / 360) * (stageWidth - size);
            bubble.style.left = `${x}px`;
            bubble.style.bottom = `0px`;

            stage.appendChild(bubble);

            setTimeout(() => {
                bubble.style.transform = `translateY(-${stage.clientHeight}px) scale(0.5)`;
                bubble.style.opacity = '0';
            }, 50);

            setTimeout(() => bubble.remove(), 900);
        }

        function playNote(key, hue) {
            if (activeOscillators[key]) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            oscillator.frequency.setValueAtTime(hueToFrequency(hue), audioCtx.currentTime);
            oscillator.type = 'triangle'; // Onda triangular: som suave

            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.01);

            oscillator.start(0);

            activeOscillators[key] = { oscillator, gainNode };
            botaoDaTecla[key].classList.add('tocando');
            createNoteBubble(hue, key);
        }

        function stopNote(key) {
            if (activeOscillators[key]) {
                const { oscillator, gainNode } = activeOscillators[key];
                const now = audioCtx.currentTime;

                // Release (decaimento do som)
                gainNode.gain.cancelScheduledValues(now);
                gainNode.gain.setValueAtTime(gainNode.gain.value, now);
                gainNode.gain.linearRampToValueAtTime(0, now + 0.2);
                oscillator.stop(now + 0.2);

                delete activeOscillators[key];
            }
            botaoDaTecla[key].classList.remove('tocando');
        }

        // --- TECLAS NA TELA (mouse e toque, vários dedos ao mesmo tempo) ---

        const botaoDaTecla = {};
        const teclaDoPonteiro = {}; // pointerId -> tecla

        Object.entries(keyToHue).forEach(([key, hue], i) => {
            const botao = document.createElement('button');
            botao.type = 'button';
            botao.className = 'tecla';
            botao.dataset.key = key;
            botao.style.backgroundColor = corDaNota(hue);
            botao.setAttribute('aria-label', `${nomesNotas[i]} (tecla ${key.toUpperCase()})`);
            botao.innerHTML = `<span>${nomesNotas[i]}</span><span class="letra">${key}</span>`;
            teclas.appendChild(botao);
            botaoDaTecla[key] = botao;
        });

        function teclaEm(x, y) {
            const el = document.elementFromPoint(x, y);
            const botao = el && el.closest('.tecla');
            return botao ? botao.dataset.key : null;
        }

        function soltarPonteiro(id) {
            const key = teclaDoPonteiro[id];
            delete teclaDoPonteiro[id];
            if (key && !Object.values(teclaDoPonteiro).includes(key)) stopNote(key);
        }

        teclas.addEventListener('pointerdown', (e) => {
            const key = teclaEm(e.clientX, e.clientY);
            if (!key) return;
            e.preventDefault();
            try { teclas.setPointerCapture(e.pointerId); } catch (erro) { /* ponteiro já foi solto */ }
            teclaDoPonteiro[e.pointerId] = key;
            playNote(key, keyToHue[key]);
        });

        // Arrastar o dedo de uma tecla para outra troca a nota (glissando)
        teclas.addEventListener('pointermove', (e) => {
            if (!(e.pointerId in teclaDoPonteiro)) return;
            const key = teclaEm(e.clientX, e.clientY);
            if (key && key !== teclaDoPonteiro[e.pointerId]) {
                soltarPonteiro(e.pointerId);
                teclaDoPonteiro[e.pointerId] = key;
                playNote(key, keyToHue[key]);
            }
        });

        ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(tipo => {
            teclas.addEventListener(tipo, (e) => soltarPonteiro(e.pointerId));
        });

        // Teclado acessível: Enter/Espaço numa tecla focada também tocam
        teclas.addEventListener('keydown', (e) => {
            const botao = e.target.closest('.tecla');
            if (botao && (e.key === 'Enter' || e.key === ' ') && !e.repeat) {
                e.preventDefault();
                playNote(botao.dataset.key, keyToHue[botao.dataset.key]);
                setTimeout(() => stopNote(botao.dataset.key), 300);
            }
        });

        // --- TECLADO DO COMPUTADOR ---

        document.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();
            if (event.repeat || event.ctrlKey || event.metaKey || event.altKey) return;
            if (keyToHue.hasOwnProperty(key)) {
                event.preventDefault();
                playNote(key, keyToHue[key]);
            }
        });

        document.addEventListener('keyup', (event) => {
            const key = event.key.toLowerCase();
            if (keyToHue.hasOwnProperty(key)) stopNote(key);
        });

        // Se a janela perder o foco, nenhuma nota fica presa tocando
        window.addEventListener('blur', () => Object.keys(activeOscillators).forEach(stopNote));
    </script>
</body>
</html>
